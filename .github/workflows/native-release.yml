name: Build native releases

on:
  push:
    tags:
      - "native-v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: false

env:
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  desktop:
    name: Desktop (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: ubuntu-22.04
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build and publish desktop bundle
        uses: tauri-apps/tauri-action@v1
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_AI_BRIDGE_URL: ${{ vars.VITE_AI_BRIDGE_URL }}
        with:
          tagName: native-v__VERSION__
          releaseName: Deutschly v__VERSION__
          releaseBody: |
            Deutschly native release. Use the Windows installer or Linux AppImage/deb for offline-first study. Android APK/AAB is uploaded by the mobile job.

            The web edition remains available at https://soheil-aghayani.github.io/Deutschly/ for always-online access. Optional AI providers are configured per device in Settings.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true

  android:
    name: Android APK and AAB
    needs: desktop
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Setup Rust for Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install dependencies
        run: npm ci

      - name: Initialize Android project
        run: npm run tauri -- android init

      - name: Configure Android release signing
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$ANDROID_KEY_BASE64"
          cd src-tauri/gen/android
          printf '%s' "$ANDROID_KEY_BASE64" | tr -d '\r\n' | base64 --decode > "$RUNNER_TEMP/deutschly-upload-keystore.jks"
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          project = Path.cwd()
          (project / "keystore.properties").write_text(
              "password={password}\nkeyAlias={alias}\nstoreFile={store}\n".format(
                  password=os.environ["ANDROID_KEY_PASSWORD"],
                  alias=os.environ["ANDROID_KEY_ALIAS"],
                  store=os.environ["RUNNER_TEMP"] + "/deutschly-upload-keystore.jks",
              ),
              encoding="utf-8",
          )

          gradle = project / "app" / "build.gradle.kts"
          text = gradle.read_text(encoding="utf-8")
          if "import java.io.FileInputStream" not in text:
              text = "import java.io.FileInputStream\n" + text
          if "import java.util.Properties" not in text:
              text = "import java.util.Properties\n" + text

          signing_config = '''signingConfigs {
              create("release") {
                  val keystorePropertiesFile = rootProject.file("keystore.properties")
                  val keystoreProperties = Properties()
                  if (keystorePropertiesFile.exists()) {
                      keystoreProperties.load(FileInputStream(keystorePropertiesFile))
                  }
                  keyAlias = keystoreProperties["keyAlias"] as String
                  keyPassword = keystoreProperties["password"] as String
                  storeFile = file(keystoreProperties["storeFile"] as String)
                  storePassword = keystoreProperties["password"] as String
              }
          }'''
          if 'create("release")' not in text:
              text = text.replace("buildTypes {", signing_config + "\n\n    buildTypes {", 1)

          assignment = 'signingConfig = signingConfigs.getByName("release")'
          if assignment not in text:
              release_block = re.compile(r'(getByName\("release"\)\s*\{\s*)')
              if release_block.search(text):
                  text = release_block.sub(r'\1        ' + assignment + "\n", text, count=1)
              else:
                  text = text.replace(
                      "buildTypes {",
                      'buildTypes {\n        getByName("release") {\n            ' + assignment + "\n        }",
                      1,
                  )
          gradle.write_text(text, encoding="utf-8")
          PY

      - name: Build APK
        run: npm run tauri -- android build --apk

      - name: Build AAB
        run: npm run tauri -- android build --aab

      - name: Find Android artifacts
        id: artifacts
        shell: bash
        run: |
          apk=$(find src-tauri/gen/android -path '*outputs/apk*release*' -type f -name '*.apk' | head -n 1)
          aab=$(find src-tauri/gen/android -path '*outputs/bundle*release*' -type f -name '*.aab' | head -n 1)
          test -n "$apk"
          test -n "$aab"
          apksigner verify --verbose "$apk"
          jarsigner -verify "$aab" >/dev/null
          cp "$apk" "Deutschly-Android.apk"
          cp "$aab" "Deutschly-Android.aab"

      - name: Upload Android artifacts to the release
        shell: bash
        run: gh release upload "native-v${GITHUB_REF_NAME#native-v}" Deutschly-Android.apk Deutschly-Android.aab --clobber
