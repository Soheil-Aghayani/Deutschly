name: Build native releases

on:
  push:
    tags:
      - "native-v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: false

env:
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  desktop:
    name: Desktop (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: ubuntu-22.04
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build and publish desktop bundle
        uses: tauri-apps/tauri-action@v1
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_AI_BRIDGE_URL: ${{ vars.VITE_AI_BRIDGE_URL }}
        with:
          tagName: native-v__VERSION__
          releaseName: Deutschly v__VERSION__
          releaseBody: |
            Deutschly native release. Use the Windows installer or Linux AppImage/deb for offline-first study. Android APK/AAB is uploaded by the mobile job.

            The web edition remains available at https://soheil-aghayani.github.io/Deutschly/ for always-online access. Optional AI providers are configured per device in Settings.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true

  android:
    name: Android APK and AAB
    needs: desktop
    runs-on: ubuntu-22.04
    env:
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      VITE_AI_BRIDGE_URL: ${{ vars.VITE_AI_BRIDGE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Setup Rust for Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install dependencies
        run: npm ci

      - name: Initialize Android project
        run: npm run tauri -- android init

      - name: Configure Android system-bar insets
        shell: bash
        run: |
          set -euo pipefail
          activity=$(find src-tauri/gen/android/app/src/main -name MainActivity.kt -type f | head -n 1)
          test -n "$activity"
          python3 - "$activity" <<'PY'
          import sys
          from pathlib import Path

          activity = Path(sys.argv[1])
          activity.write_text(r'''package com.deutschly.app

          import android.graphics.Color
          import android.os.Build
          import android.os.Bundle
          import android.view.ViewGroup
          import android.view.WindowInsets
          import android.webkit.JavascriptInterface
          import android.webkit.WebView
          import androidx.activity.enableEdgeToEdge
          import kotlin.math.roundToInt

          class MainActivity : TauriActivity() {
              private var contentWebView: WebView? = null
              private var contentRoot: ViewGroup? = null
              private var currentInsets = WindowInsetValues()

              override fun onCreate(savedInstanceState: Bundle?) {
                  enableEdgeToEdge()
                  super.onCreate(savedInstanceState)
                  // Android 15 can force transparent system bars for target SDK 35.
                  // Keep edge-to-edge system bars, but clip the native content
                  // viewport so fixed web content cannot sit underneath them.
                  window.statusBarColor = Color.TRANSPARENT
                  window.navigationBarColor = Color.TRANSPARENT
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      window.isNavigationBarContrastEnforced = false
                  }
                  window.decorView.setOnApplyWindowInsetsListener { _, insets ->
                      currentInsets = readInsets(insets)
                      applyNativeInsets()
                      publishInsets()
                      insets
                  }
                  contentRoot = findViewById(android.R.id.content)
                  contentRoot?.setOnApplyWindowInsetsListener { _, insets ->
                      currentInsets = readInsets(insets)
                      applyNativeInsets()
                      publishInsets()
                      insets
                  }
                  window.decorView.post { window.decorView.requestApplyInsets() }
                  contentRoot?.post { refreshInsetsFromRoot() }
              }

              override fun onWebViewCreate(webView: WebView) {
                  super.onWebViewCreate(webView)
                  contentWebView = webView
                  contentRoot = findViewById(android.R.id.content)
                  webView.addJavascriptInterface(InsetsBridge(), "DeutschlyAndroidInsets")
                  webView.setOnApplyWindowInsetsListener { _, insets ->
                      // Use the values captured from the window listener. On a few
                      // WebView versions the child callback reports zero after the
                      // window has already received the real system-bar insets.
                      applyNativeInsets()
                      publishInsets()
                      insets
                  }
                  requestInsets(webView)
                  webView.postDelayed({ requestInsets(webView) }, 250)
                  webView.postDelayed({ requestInsets(webView) }, 900)
                  webView.postDelayed({ refreshInsetsFromRoot() }, 1200)
              }

              override fun onWindowFocusChanged(hasFocus: Boolean) {
                  super.onWindowFocusChanged(hasFocus)
                  if (hasFocus) {
                      window.decorView.post { window.decorView.requestApplyInsets() }
                      contentRoot?.post { refreshInsetsFromRoot() }
                  }
              }

              private fun requestInsets(webView: WebView) {
                  webView.requestApplyInsets()
                  window.decorView.requestApplyInsets()
                  contentRoot?.requestApplyInsets()
                  webView.post {
                      refreshInsetsFromRoot()
                      applyNativeInsets()
                      publishInsets()
                  }
              }

              private fun refreshInsetsFromRoot() {
                  val root = contentRoot ?: findViewById<ViewGroup>(android.R.id.content)
                  val rootInsets = window.decorView.rootWindowInsets ?: root.rootWindowInsets ?: return
                  currentInsets = readInsets(rootInsets)
                  applyNativeInsets()
                  publishInsets()
              }

              private fun applyNativeInsets() {
                  // Clip the native content viewport itself. This is different
                  // from padding the WebView: fixed-position web elements now
                  // see a viewport that genuinely starts below the status bar
                  // and ends above the navigation/gesture area.
                  val root = contentRoot ?: return
                  val insets = currentInsets
                  root.setPadding(
                      insets.left.roundToInt(),
                      insets.top.roundToInt(),
                      insets.right.roundToInt(),
                      insets.bottom.roundToInt(),
                  )
                  root.clipToPadding = true
                  contentWebView?.setPadding(0, 0, 0, 0)
              }

              private fun readInsets(insets: WindowInsets): WindowInsetValues {
                  val density = resources.displayMetrics.density.coerceAtLeast(1f)
                  val statusBarFallback = systemDimension("status_bar_height")
                  val navigationBarFallback = maxOf(
                      systemDimension("navigation_bar_height"),
                      systemDimension("navigation_bar_height_gesture"),
                  )
                  val (left, top, right, bottom) = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      val types = WindowInsets.Type.systemBars() or WindowInsets.Type.displayCutout()
                      val visibleBars = insets.getInsets(types)
                      val stableBars = insets.getInsetsIgnoringVisibility(types)
                      val gestures = insets.getInsetsIgnoringVisibility(WindowInsets.Type.mandatorySystemGestures())
                      listOf(
                          maxOf(visibleBars.left, stableBars.left, gestures.left),
                          maxOf(visibleBars.top, stableBars.top),
                          maxOf(visibleBars.right, stableBars.right, gestures.right),
                          maxOf(visibleBars.bottom, stableBars.bottom, gestures.bottom),
                      )
                  } else {
                      @Suppress("DEPRECATION")
                      listOf(
                          insets.systemWindowInsetLeft,
                          insets.systemWindowInsetTop,
                          insets.systemWindowInsetRight,
                          insets.systemWindowInsetBottom,
                      )
                  }
                  val safeTop = maxOf(top, statusBarFallback)
                  val safeBottom = maxOf(bottom, navigationBarFallback)
                  return WindowInsetValues(
                      top = safeTop / density,
                      right = right / density,
                      bottom = safeBottom / density,
                      left = left / density,
                  )
              }

              private fun systemDimension(name: String): Int {
                  val resourceId = resources.getIdentifier(name, "dimen", "android")
                  return if (resourceId == 0) 0 else resources.getDimensionPixelSize(resourceId)
              }

              private fun publishInsets() {
                  val webView = contentWebView ?: return
                  val insets = currentInsets
                  val script = """
                      (function() {
                        var detail = {top: ${insets.top}, right: ${insets.right}, bottom: ${insets.bottom}, left: ${insets.left}};
                        window.__DEUTSCHLY_ANDROID_INSETS__ = detail;
                        document.documentElement.dataset.nativeWindowInsets = 'padded';
                        window.dispatchEvent(new CustomEvent('deutschly:android-insets', {detail: detail}));
                      })();
                  """.trimIndent()
                  webView.post { webView.evaluateJavascript(script, null) }
              }

              private inner class InsetsBridge {
                  @JavascriptInterface
                  fun getInsets(): String {
                      val insets = currentInsets
                      return "{\"top\":${insets.top},\"right\":${insets.right},\"bottom\":${insets.bottom},\"left\":${insets.left}}"
                  }
              }

              private data class WindowInsetValues(
                  val top: Float = 0f,
                  val right: Float = 0f,
                  val bottom: Float = 0f,
                  val left: Float = 0f,
              )
          }
          ''', encoding="utf-8")
          PY

      - name: Configure Android release signing
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$ANDROID_KEY_BASE64"
          cd src-tauri/gen/android
          printf '%s' "$ANDROID_KEY_BASE64" | tr -d '\r\n' | base64 --decode > "$RUNNER_TEMP/deutschly-upload-keystore.jks"
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          project = Path.cwd()
          (project / "keystore.properties").write_text(
              "password={password}\nkeyAlias={alias}\nstoreFile={store}\n".format(
                  password=os.environ["ANDROID_KEY_PASSWORD"],
                  alias=os.environ["ANDROID_KEY_ALIAS"],
                  store=os.environ["RUNNER_TEMP"] + "/deutschly-upload-keystore.jks",
              ),
              encoding="utf-8",
          )

          gradle = project / "app" / "build.gradle.kts"
          text = gradle.read_text(encoding="utf-8")
          if "import java.io.FileInputStream" not in text:
              text = "import java.io.FileInputStream\n" + text
          if "import java.util.Properties" not in text:
              text = "import java.util.Properties\n" + text

          signing_config = '''signingConfigs {
              create("release") {
                  val keystorePropertiesFile = rootProject.file("keystore.properties")
                  val keystoreProperties = Properties()
                  if (keystorePropertiesFile.exists()) {
                      keystoreProperties.load(FileInputStream(keystorePropertiesFile))
                  }
                  keyAlias = keystoreProperties["keyAlias"] as String
                  keyPassword = keystoreProperties["password"] as String
                  storeFile = file(keystoreProperties["storeFile"] as String)
                  storePassword = keystoreProperties["password"] as String
              }
          }'''
          if 'create("release")' not in text:
              text = text.replace("buildTypes {", signing_config + "\n\n    buildTypes {", 1)

          assignment = 'signingConfig = signingConfigs.getByName("release")'
          if assignment not in text:
              release_block = re.compile(r'(getByName\("release"\)\s*\{\s*)')
              if release_block.search(text):
                  text = release_block.sub(r'\1        ' + assignment + "\n", text, count=1)
              else:
                  text = text.replace(
                      "buildTypes {",
                      'buildTypes {\n        getByName("release") {\n            ' + assignment + "\n        }",
                      1,
                  )
          gradle.write_text(text, encoding="utf-8")
          PY

      - name: Build APK
        run: npm run tauri -- android build --apk

      - name: Build AAB
        run: npm run tauri -- android build --aab

      - name: Find Android artifacts
        id: artifacts
        shell: bash
        run: |
          apk=$(find src-tauri/gen/android -path '*outputs/apk*release*' -type f -name '*.apk' | head -n 1)
          aab=$(find src-tauri/gen/android -path '*outputs/bundle*release*' -type f -name '*.aab' | head -n 1)
          test -n "$apk"
          test -n "$aab"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          jarsigner -verify "$aab" >/dev/null
          cp "$apk" "Deutschly-Android.apk"
          cp "$aab" "Deutschly-Android.aab"

      - name: Upload Android artifacts to the release
        shell: bash
        run: gh release upload "native-v${GITHUB_REF_NAME#native-v}" Deutschly-Android.apk Deutschly-Android.aab --clobber
